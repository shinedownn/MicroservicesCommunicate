version: '3.4'

services:
  contactmicroservice:
    image: ${DOCKER_REGISTRY-}contactmicroservice
    build:
      context: .
      dockerfile: ContactMicroservice\Dockerfile
  postgresql_database:
    image: postgres:latest
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=MyTestDb
    ports:
      - "5433:5432"
    restart: always 
     
  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=admin1234
    ports:
      - "5050:80"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    environment: 
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin1234
    ports:
      - 5673:5672
      - 15673:15672

  reportmicroservice:
    image: ${DOCKER_REGISTRY-}reportmicroservice
    build:
      context: .
      dockerfile: ReportMicroservice\Dockerfile

