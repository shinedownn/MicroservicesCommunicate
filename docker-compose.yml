version: '3.4'

services:
  contactmicroservice:
    platform: linux/amd64
    image: ${DOCKER_REGISTRY-}contactmicroservice
    build:
      context: .
      dockerfile: ContactMicroservice\Dockerfile
    ports:
      - 5000:80

  reportmicroservice:
    platform: linux/amd64
    image: ${DOCKER_REGISTRY-}reportmicroservice
    build:
      context: .
      dockerfile: ReportMicroservice\Dockerfile
    ports:
      - 5001:80

  postgresql_database:
    platform: linux/amd64
    image: postgres:latest
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=MyTestDb
    ports:
      - "5433:5432"
    restart: always 
     
  pgadmin:
    platform: linux/amd64
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=admin1234
    ports:
      - "5051:80"
    restart: always

  rabbitmq:
    platform: linux/amd64
    image: rabbitmq:3-management
    environment: 
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin1234
    ports:
      - 5672:5672
      - 15672:15672




