version: '3.8'
services:
  contactmicroservice:
    networks:
      - mycase
    platform: linux/amd64
    image: ${DOCKER_REGISTRY-}contactmicroservice
    build:
      context: .
      dockerfile: ContactMicroservice\Dockerfile
    ports:
      - 5000:80

  reportmicroservice:
    networks:
      - mycase
    platform: linux/amd64
    image: ${DOCKER_REGISTRY-}reportmicroservice
    build:
      context: .
      dockerfile: ReportMicroservice\Dockerfile
    ports:
      - 5001:80
  postgresql_database:
    networks:
      - mycase
    container_name: postgres_container
    image: postgres
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin1234
      - POSTGRES_DB=ContactMicroservice
      - PGDATA= /data/postgres 
    ports:
      - "6543:5432" 
    restart: always 

  pgadmin:
    networks:
      - mycase
    platform: linux/amd64
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=pgadmin4@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=admin1234 
    ports:
      - "5051:80" 
    restart: always
    depends_on:
      - postgresql_database
  rabbitmq:
    networks:
      - mycase
    platform: linux/amd64
    image: rabbitmq:3-management
    hostname: "rabbitmq"
    environment: 
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin1234
    ports:
      - 5672:5672
      - 15672:15672

networks:
   mycase: